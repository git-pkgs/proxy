{{define "severity_badge"}}
<span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium uppercase {{if eq . "critical"}}bg-red-100 text-red-700 dark:bg-red-900 dark:text-red-300{{else if eq . "high"}}bg-orange-100 text-orange-700 dark:bg-orange-900 dark:text-orange-300{{else if eq . "medium"}}bg-yellow-100 text-yellow-800 dark:bg-yellow-900 dark:text-yellow-300{{else}}bg-blue-100 text-blue-700 dark:bg-blue-900 dark:text-blue-300{{end}}">{{if .}}{{.}}{{else}}unknown{{end}}</span>
{{end}}
